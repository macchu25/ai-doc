const tagLabels = { be:"Backend", fe:"Frontend", ai:"AI/ML", infra:"Infra", db:"Database", qa:"QA", doc:"Docs" };

const container = document.getElementById('wbs-container');

phases.forEach((phase, pi) => {
  const el = document.createElement('div');
  el.className = `phase ${phase.cls}`;

  const header = document.createElement('div');
  header.className = 'phase-header';
  const totalTasks = phase.groups.reduce((a, g) => a + g.tasks.length, 0);
  header.innerHTML = `
    <span class="phase-badge">${phase.label}</span>
    <span class="phase-title">${phase.title}</span>
    <span class="phase-meta">${totalTasks} task · ${phase.weeks}</span>
    <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
  `;

  const body = document.createElement('div');
  body.className = 'phase-body';
  body.style.display = pi === 0 ? 'block' : 'none';

  phase.groups.forEach((group, gi) => {
    const grpEl = document.createElement('div');
    grpEl.className = 'group';
    if (gi > 0) {
      const div = document.createElement('hr');
      div.className = 'divider';
      body.appendChild(div);
    }
    grpEl.innerHTML = `<div class="group-label">${group.label}</div>`;
    const list = document.createElement('div');
    list.className = 'task-list';
    group.tasks.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task';
      row.innerHTML = `<span class="task-id">${t.id}</span><span class="task-name">${t.name}</span><span class="task-tag ${tagClasses[t.tag]}">${tagLabels[t.tag]}</span>`;
      list.appendChild(row);
    });
    grpEl.appendChild(list);
    body.appendChild(grpEl);
  });

  header.addEventListener('click', () => {
    const isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : 'block';
    header.querySelector('.chevron').classList.toggle('open', !isOpen);
  });

  if (pi === 0) header.querySelector('.chevron').classList.add('open');

  el.appendChild(header);
  el.appendChild(body);
  container.appendChild(el);
});
</script>
